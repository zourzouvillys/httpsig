name: Release Go

on:
  push:
    tags: ['go/v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'

      - name: Test
        working-directory: golang
        run: go test -race ./...

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/go/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: "Go ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          body: |
            ## Go ${{ steps.version.outputs.version }}

            ```bash
            go get github.com/zourzouvillys/httpsig/golang@${{ steps.version.outputs.version }}
            ```

            Go modules are published automatically via [proxy.golang.org](https://proxy.golang.org).
