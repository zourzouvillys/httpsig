name: Go

on:
  push:
    paths: ['golang/**', 'testdata/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['golang/**', 'testdata/**', '.github/workflows/go.yml']
  workflow_dispatch:

# Read-only token: this runs untrusted PR code (compile/test) and needs no write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: golang/go.sum

      - name: Vet
        working-directory: golang
        run: go vet ./...

      - name: Test
        working-directory: golang
        run: go test -race -v ./...

      - name: Build
        working-directory: golang
        run: go build ./...
